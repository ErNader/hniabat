<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فرم مشارکت هیئت انصارالحسین</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>همراه گرامی 🌺</h1>
            <p>در صورت تمایل به مشارکت مستمر در برگزاری مراسمات روضه و جشن هیئت انصارالحسین علیه السلام در طول سال 👇</p>
            <p>فرم را تکمیل نموده</p>
        </div>
        <form id="contribution-form">
            <div class="form-group">
                <label for="name">۱. نام</label>
                <input type="text" id="name" name="name" required>
            </div>
            <div class="form-group">
                <label for="memorial">۲. یادبود</label>
                <input type="text" id="memorial" name="memorial">
            </div>
            <div class="form-group">
                <label for="phone">۳. شماره تماس</label>
                <input type="tel" id="phone" name="phone" required>
            </div>
            <div class="form-group">
                <label for="amount">۴. مبلغ دلخواه ماهیانه</label>
                <input type="number" id="amount" name="amount" required>
            </div>
            <div class="form-group">
                <label for="payment-date">۵. تاریخ پرداخت هر ماه</label>
                <input type="text" id="payment-date" name="payment-date" placeholder="مثال: پنجم هر ماه" required>
            </div>
            <button type="submit">ارسال</button>
        </form>
        <div class="eitaa-link">
            <a href="https://eitaa.com/joinchat/239142017Ce76e3363bf" class="button">طرح نورانی و جاری هیئت به نیابت 🧑‍🤝‍🧑</a>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
    <script src="script.js"></script>
</body>
</html>
